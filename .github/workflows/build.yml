name: Build

on:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx electron-forge make
      - uses: actions/upload-artifact@v4
        with:
          name: BirdBox-Windows
          path: out/make/**/*.exe

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx electron-forge make
      - uses: actions/upload-artifact@v4
        with:
          name: BirdBox-Mac
          path: out/make/**/*.dmg